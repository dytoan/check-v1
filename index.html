<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check IP & Device</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>THÔNG TIN TRUY CẬP</h1>
        <div id="loading">Đang thu thập dữ liệu...</div>
        <div id="result" class="hidden">
            <div class="info-box">
                <h2>IP</h2>
                <p id="ip">-</p>
            </div>
            <div class="info-box">
                <h2>VỊ TRÍ CHÍNH XÁC</h2>
                <p id="location">-</p>
            </div>
            <div class="info-box">
                <h2>THIẾT BỊ</h2>
                <p id="device">-</p>
            </div>
            <div class="info-box">
                <h2>TRÌNH DUYỆT</h2>
                <p id="browser">-</p>
            </div>
            <div class="info-box">
                <h2>HỆ ĐIỀU HÀNH</h2>
                <p id="os">-</p>
            </div>
            <div class="info-box">
                <h2>MÀN HÌNH</h2>
                <p id="screen">-</p>
            </div>
            <div class="info-box">
                <h2>NGÔN NGỮ</h2>
                <p id="language">-</p>
            </div>
            <div class="info-box">
                <h2>THỜI GIAN</h2>
                <p id="time">-</p>
            </div>
            <div class="info-box">
                <h2>BẢN ĐỒ</h2>
                <p id="map">-</p>
            </div>
            <div class="info-box">
                <h2>TRẠNG THÁI LƯU</h2>
                <p id="status">-</p>
            </div>
        </div>
        <div class="admin-link">
            <a href="admin.html">ADMIN PANEL</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
